# ============================================================
# LeRobot 推理环境 - Conda 环境定义
# 生成日期: 2026-08-03
# 源机器: Windows 11 | Python 3.12.13 | PyTorch 2.11.0+cu128 | CUDA 12.8
# ============================================================
#
# 一键创建命令:
#   conda env create -f environment.yml
#   conda activate lerobot
#   # 然后在项目根目录安装 lerobot 可编辑模式:
#   pip install -e .
#
# 前提条件:
#   - 新电脑需安装 Anaconda/Miniconda
#   - 新电脑需有 NVIDIA GPU + CUDA 12.8 兼容驱动
#   - 需将整个 lerobot 项目文件夹拷贝到新电脑
# ============================================================

name: lerobot
channels:
  - conda-forge
  - defaults
dependencies:
  # === Conda 包 (仅核心, 其余依赖会自动解析) ===
  - python=3.12.13
  - ffmpeg=6.1.2          # 视频解码必需 (PyAV 依赖)
  - pip

  # === Pip 包 ===
  - pip:
      # PyTorch CUDA 12.8 专用索引
      - --extra-index-url https://download.pytorch.org/whl/cu128

      # --- PyTorch 生态 (CUDA 12.8) ---
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - torchcodec==0.11.1

      # --- HuggingFace 生态 ---
      - transformers==5.5.4
      - datasets==4.8.5
      - huggingface-hub==1.24.0
      - accelerate==1.14.0
      - tokenizers==0.22.2
      - safetensors==0.8.0
      - hf-xet==1.5.2

      # --- LeRobot 核心依赖 ---
      - draccus==0.10.0
      - gymnasium==1.3.0
      - deepdiff==8.6.2
      - datasets==4.8.5
      - einops==0.8.2
      - pyarrow==25.0.0
      - pandas==2.3.3
      - pyyaml==6.0.3
      - pyyaml-include==1.4.1
      - toml==0.10.2
      - jsonlines==4.0.0
      - num2words==0.5.14
      - termcolor==3.3.0
      - rerun-sdk==0.33.1
      - foxglove-sdk==0.25.3
      - wandb==0.27.2
      - stable-baselines3==2.9.0

      # --- 视觉/视频 ---
      - opencv-python==5.0.0.93
      - opencv-python-headless==4.13.0.92
      - av==15.1.0
      - pillow==12.2.0

      # --- 策略专用 ---
      - diffusers==0.35.2          # Diffusion 策略必需

      # --- 硬件 SDK (SO-101) ---
      - feetech-servo-sdk==1.0.0   # Feetech 舵机
      - pyserial==3.5              # 串口通信
      - pyrealsense2==2.58.3.10794 # RealSense 相机
      - pynput==1.8.2              # Windows 键盘输入 (替代 termios)

      # --- 仿真环境 ---
